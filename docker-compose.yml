services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fever
      POSTGRES_USER: fever
      POSTGRES_PASSWORD: fever
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fever -d fever"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: fever
      POSTGRES_USER: fever
      POSTGRES_PASSWORD: fever
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
